[project]
name = "reviewmate-mcp"
version = "1.0.0"
description = "ReviewMate MCP Server - AI PR Review tools for Claude/Cursor"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.1",
    "httpx>=0.27.0",
]

[project.scripts]
reviewmate-mcp = "reviewmate_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
